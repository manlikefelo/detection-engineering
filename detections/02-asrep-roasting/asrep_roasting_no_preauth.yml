title: AS-REP Roasting - Kerberos AS-REQ With Pre-Authentication Disabled
id: 8b1c3d4f-5a6e-4b2c-9d0f-3b2f6d8e0022
status: stable
description: |
    Detects a Kerberos authentication-service request (AS-REQ / Event 4768) that
    was served with pre-authentication type 0 - meaning the account has
    "Do not require Kerberos preauthentication" set. The DC returns an AS-REP whose
    encrypted portion can be cracked offline, and this requires no valid credentials
    from the attacker, only the username. An RC4 (0x17) ticket makes the offline
    crack fast.
references:
    - https://attack.mitre.org/techniques/T1558/004/
    - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4768
author: Felix Githure
date: 2026-07-31
tags:
    - attack.credential-access
    - attack.t1558.004
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4768
        PreAuthType: '0'
    condition: selection
falsepositives:
    - Rare legitimate accounts intentionally configured without pre-authentication
      for legacy interoperability - these should be inventoried and whitelisted.
level: high
